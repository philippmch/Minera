name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its older run; runs on main always
# finish, since the native job takes over an hour and main moves often.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

# docs/ holds about 11 GB of *.jsonl.gz evidence logs that no build or test
# reads. Every job uses a blobless partial clone with a sparse checkout that
# leaves them out, so a checkout downloads well under 1 GB.
env:
  SPARSE_CHECKOUT: |
    /*
    !/docs/**/*.jsonl.gz
    !/docs/*.jsonl.gz

jobs:
  native:
    name: Native build and ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      # The hosted runner has 16 GB of memory; four parallel compiles of the
      # largest sources can exhaust it and lose the runner, so the build runs
      # two at a time with extra swap as headroom.
      # The build directory needs well over the runner's free disk once the
      # swap file and ccache are counted, so drop preinstalled toolchains
      # this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Add swap
        run: |
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
        run: cmake --build build -j2
      - name: ctest
        run: ctest --test-dir build -j3 --output-on-failure --timeout 1800

  # Linux CI alone missed breaks that only Apple libc++ (no std time-zone
  # database, size_t != uint64_t) or MSVC (32-bit long, no __int128) see, so
  # the same build and tests also run on macOS and Windows.
  native-cross:
    name: Native build and ctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # The macOS 15 SDK's libc++ cannot parse floating point with
        # std::from_chars, which the core relies on.
        os: [macos-26, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      # Git Bash puts its own link.exe ahead of MSVC's on PATH, so the build
      # steps use the default shell (PowerShell on Windows).
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja ccache --no-progress -y
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
        # Keep going past failures so one run reports every platform break.
        run: cmake --build build -j3 -- -k 0
      - name: ctest
        run: ctest --test-dir build -j3 --output-on-failure --timeout 1800

  python:
    name: Python script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-query.txt
      # Some tests create scratch folders under build/.
      - run: mkdir -p build && python -m unittest discover -s scripts/tests

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --testTimeout 20000

  parity:
    name: Reference parity verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: ${{ env.SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the pinned 2.7.22 reference release
        run: |
          git init "$RUNNER_TEMP/reference"
          cd "$RUNNER_TEMP/reference"
          git fetch --depth 1 https://github.com/process-intelligence-solutions/pm4py.git 0715c31f3f1d85924107d6aa5329806db69df899
          git checkout --quiet FETCH_HEAD
          git tag 2.7.22 FETCH_HEAD
      - run: node scripts/test-reference-parity-verifier.mjs "$RUNNER_TEMP/reference"
      - run: node scripts/test-reference-parity-source-parser.mjs
      - run: node scripts/verify-reference-parity.mjs "$RUNNER_TEMP/reference" --require-complete
